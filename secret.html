
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Secret for Maryam 🌙</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Georgia, serif;
    color: #fff5e6;

    background:
        radial-gradient(circle at top, #65417d, transparent 45%),
        linear-gradient(145deg, #100d2b, #28153f, #4b2148);

    text-align: center;
    overflow-x: hidden;
}

.card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 650px;
    padding: 40px 30px;

    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,224,170,.4);
    border-radius: 25px;

    box-shadow: 0 0 40px rgba(0,0,0,.25);
    backdrop-filter: blur(10px);
}

.moon {
    font-size: 55px;
    margin-bottom: 20px;
}

h1 {
    color: #ffe6ad;
    font-size: clamp(30px,6vw,45px);
    margin-bottom: 25px;
}

.message {
    font-size: 18px;
    line-height: 2;
    color: #fce8f3;
    white-space: pre-line;
    margin-bottom: 30px;
}

button {
    border: none;
    padding: 13px 25px;
    border-radius: 30px;

    background: #f0c5d8;
    color: #321a37;

    font-family: Georgia, serif;
    font-size: 16px;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    transform: scale(1.05);
    background: #ffe6ad;
}

.flower {
    position: fixed;
    top: -40px;
    pointer-events: none;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

@media(max-width:500px) {
    .card {
        padding: 30px 20px;
    }

    .message {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="moon">🌙</div>

    <h1 id="heading">A Little Secret</h1>

    <div class="message" id="message"></div>

    <button onclick="window.location.href='./index.html'">
        ← Back to my memories
    </button>

</div>

<script>

// FOUR SECRET PAGES
// Replace the placeholder text with your own paragraphs.

const secrets = {

    1: {
        heading: "A Little Secret 🌸",
        message: `WRITE YOUR FIRST SECRET PARAGRAPH HERE...`
    },

    2: {
        heading: "Something Special 💍",
        message: `WRITE YOUR PROPOSAL PARAGRAPH HERE...`
    },

    3: {
        heading: "What I Adore About You 💗",
        message: `WRITE WHAT YOU LIKE ABOUT MARYAM HERE...`
    },

    4: {
        heading: "Why You? 🌙",
        message: `WRITE WHY YOU CHOSE MARYAM HERE...`
    }

};


// GET SELECTED SECRET FROM URL

const params = new URLSearchParams(window.location.search);

const number = params.get("secret");

const secret = secrets[number] || secrets[1];

document.title = secret.heading + " | Maryam";

document.getElementById("heading").textContent =
    secret.heading;

document.getElementById("message").textContent =
    secret.message;


// FALLING FLOWERS

const flowers = ["🌸", "🌷", "💮", "✨", "🌺"];

function createFlower() {

    const flower = document.createElement("div");

    flower.className = "flower";

    flower.textContent =
        flowers[Math.floor(Math.random() * flowers.length)];

    flower.style.left = Math.random() * 100 + "vw";

    flower.style.fontSize =
        (16 + Math.random() * 17) + "px";

    flower.style.animationDuration =
        (5 + Math.random() * 6) + "s";

    document.body.appendChild(flower);

    setTimeout(() => flower.remove(), 11000);
}

setInterval(createFlower, 650);

</script>

</body>
</html>
