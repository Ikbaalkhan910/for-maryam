
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Secret for You!!🌙</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Georgia, serif;
    color: #fff5e6;

    background:
        radial-gradient(circle at top, #65417d, transparent 45%),
        linear-gradient(145deg, #100d2b, #28153f, #4b2148);

    text-align: center;
    overflow-x: hidden;
}

.card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 650px;
    padding: 40px 30px;

    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,224,170,.4);
    border-radius: 25px;

    box-shadow: 0 0 40px rgba(0,0,0,.25);
    backdrop-filter: blur(10px);
}

.moon {
    font-size: 55px;
    margin-bottom: 20px;
}

h1 {
    color: #ffe6ad;
    font-size: clamp(30px,6vw,45px);
    margin-bottom: 25px;
}

.message {
    font-size: 18px;
    line-height: 2;
    color: #fce8f3;
    white-space: pre-line;
    margin-bottom: 30px;
}

button {
    border: none;
    padding: 13px 25px;
    border-radius: 30px;

    background: #f0c5d8;
    color: #321a37;

    font-family: Georgia, serif;
    font-size: 16px;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    transform: scale(1.05);
    background: #ffe6ad;
}

.flower {
    position: fixed;
    top: -40px;
    pointer-events: none;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

@media(max-width:500px) {
    .card {
        padding: 30px 20px;
    }

    .message {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="moon">🌙</div>

    <h1 id="heading">A Little Secret</h1>

    <div class="message" id="message"></div>

    <button onclick="window.location.href='./index.html'">
        ← Back to my memories
    </button>

</div>

<script>

const secrets = {

    1: {
        heading: "A Little Secret 🌸",
        message: `yk everyday when u sleep i look at u...? and think how much i love you..? sometimes i just sit there smiling at the screen, wondering how someone can be this precious to me. i wish you could see yourself through my eyes, even for just a second. you'd understand why i never get tired of looking at you. even the smallest things about you make my day better. and honestly? i could spend hours just admiring you without saying a single word. i hope you always know how special you are to me. 💗🌷`
    },

    2: {
        heading: "Something Special 💍",
        message: `ik u don't really like proposals and maybe this is a little unexpected but... can i ask you something? 👉🏻👈🏻 what if we stopped being just two people who talk and became something more? what if i got to call you mine, make you smile every day and be the person you can run to whenever you need someone? i don't promise to be perfect, but i promise to try my best to make you feel loved, appreciated and safe. so... can we get into a relationship? 🥺💗🌸

        💐 a little flower for the prettiest girl
        🌷 and a little question for the most special one...`
    },

    3: {
        heading: "What I Adore About You 💗",
        message: `where do i even start? i adore your eyes, the way they make me forget everything around me. i adore your smile, because somehow seeing you happy makes me happy too. i love it when you show me your little expressions, your random moments and even the smallest things about your day. i adore how you ask me whether i've eaten or had enough water. it's the little things you do without even realising how much they mean to me. and honestly, there's so much more i could write, but no amount of words would ever be enough to describe how beautiful you are to me. 🌷🥹💗`
    },

    4: {
        heading: "Why You? 🌙",
        message: `why you? because there's something about you that i just can't find anywhere else. you're special in ways you probably don't even realise. it's not just your beautiful eyes or your smile, it's the person you are. the way you talk, the way you care, the way you make ordinary moments feel special. i don't need someone perfect, i just want someone whose presence makes everything feel a little better. and somehow, that's you. out of all the people i could have met, i'm genuinely glad i met you. i don't know what the future holds, but i know that right now, you're someone i really don't want to lose. thank you for being you, my pretty girl. 🌙💗`
    }

};


// GET SELECTED SECRET FROM URL

const params = new URLSearchParams(window.location.search);

const number = params.get("secret");

const secret = secrets[number] || secrets[1];

document.title = secret.heading + " | Maryam";

document.getElementById("heading").textContent =
    secret.heading;

document.getElementById("message").textContent =
    secret.message;


// FALLING FLOWERS

const flowers = ["🌸", "🌷", "💮", "✨", "🌺", "💐", "🦋"];

function createFlower() {

    const flower = document.createElement("div");

    flower.className = "flower";

    flower.textContent =
        flowers[Math.floor(Math.random() * flowers.length)];

    flower.style.left = Math.random() * 100 + "vw";

    flower.style.fontSize =
        (16 + Math.random() * 17) + "px";

    flower.style.animationDuration =
        (5 + Math.random() * 6) + "s";

    document.body.appendChild(flower);

    setTimeout(() => flower.remove(), 11000);
}

setInterval(createFlower, 650);

</script>

</body>
</html>
