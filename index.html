
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#210817">
<title>One Question For Maryam ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    min-height: 100svh;
    background: linear-gradient(135deg,#190711,#48152c,#210817);
    color: #fff0f4;
    font-family: Georgia,serif;
    text-align: center;
    overflow-x: hidden;
    padding: 25px 15px;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 30px 20px;
    position: relative;
    z-index: 2;
}

h1 {
    font-size: clamp(35px,9vw,55px);
    color: #ffb6cb;
    text-shadow: 0 0 20px #ff477e;
    margin: 20px 0;
}

p {
    color: #ffe3ec;
    font-size: 17px;
    line-height: 1.8;
    margin: 15px auto;
}

.heart {
    font-size: 65px;
    animation: beat 1.2s infinite;
}

@keyframes beat {
    50% { transform: scale(1.2); }
}

.subtitle {
    color: #ffb6cb;
    font-size: 15px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 12px;
    margin: 30px auto;
}

.photo {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 17px;
    border: 2px solid #ff9fba;
    box-shadow: 0 5px 20px #0005;
    transition: .3s;
}

.photo:hover {
    transform: scale(1.04);
}

.photo-error {
    height: 220px;
    border: 1px dashed #ff9fba;
    border-radius: 17px;
    display: grid;
    place-items: center;
    color: #ffb6cb;
    font-size: 14px;
}

.question-box {
    margin-top: 35px;
    padding: 28px 18px;
    border-radius: 25px;
    background: #ffffff0d;
    border: 1px solid #ffb6cb55;
    box-shadow: 0 0 30px #ff477e22;
}

.question {
    color: #ffb6cb;
    font-size: clamp(25px,6vw,34px);
    line-height: 1.5;
    margin: 15px 0 25px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 35px;
    padding: 15px 32px;
    font-size: 18px;
    font-family: Georgia,serif;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    transform: scale(1.08);
}

.yes {
    background: #ff477e;
    color: white;
    box-shadow: 0 0 20px #ff477e88;
}

.no {
    background: #ffffff15;
    color: #ffb6cb;
    border: 1px solid #ffb6cb88;
}

.footer {
    margin-top: 35px;
    color: #ffb6cb;
    font-size: 14px;
}

.flower {
    position: fixed;
    bottom: -40px;
    pointer-events: none;
    z-index: 1;
    animation: rise 9s linear forwards;
}

@keyframes rise {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@media(max-width:380px) {
    .photo,.photo-error {
        height: 175px;
    }

    button {
        padding: 14px 25px;
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="heart">💗</div>

    <p class="subtitle">A little question for someone special...</p>

    <h1>Hey Maryam 🌷</h1>

    <p>
        I don't know if it's too soon,
        but there's something I've wanted to ask you.
    </p>

    <!-- HER PHOTOS -->

    <div class="gallery">

        <img class="photo" data-image="maryam-1" alt="Maryam">
        <img class="photo" data-image="maryam-2" alt="Maryam">
        <img class="photo" data-image="maryam-3" alt="Maryam">
        <img class="photo" data-image="maryam-4" alt="Maryam">

    </div>

    <div class="question-box">

        <div class="heart">🌷</div>

        <div class="question">
            Will you be my girlfriend? 🥺❤️
        </div>

        <p>
            Just be honest with me.
            Your answer matters, whatever it is.
        </p>

        <div class="buttons">

            <button class="yes" onclick="sendAnswer('YES ❤️')">
                YES! 💗
            </button>

            <button class="no" onclick="sendAnswer('NO 🥺')">
                NO 🌷
            </button>

        </div>

    </div>

    <div class="footer">
        Made with love, just for Maryam ❤️
        <br><br>
        🌷 🌸 💗 🌸 🌷
    </div>

</div>


<script>

// YOUR WHATSAPP NUMBER
// Replace with your country code + number.
// Example for India: 919876543210

const myWhatsApp = "91YOURNUMBER";


function sendAnswer(answer) {

    const message =
        "Hey! I answered your question... 🥺❤️\n\n" +
        "My answer is: " + answer;

    const whatsappURL =
        "https://wa.me/" +
        myWhatsApp +
        "?text=" +
        encodeURIComponent(message);

    window.open(whatsappURL, "_blank");

}


// AUTOMATIC IMAGE FORMAT DETECTION

const extensions = [
    ".jpeg",
    ".jpg",
    ".png",
    ".webp",
    ".JPG",
    ".JPEG",
    ".PNG"
];

document.querySelectorAll("[data-image]").forEach(img => {

    const name = img.dataset.image;
    let index = 0;

    function tryImage() {

        if (index >= extensions.length) {

            const error = document.createElement("div");
            error.className = "photo-error";
            error.textContent = "A little memory 🌷";

            img.replaceWith(error);
            return;
        }

        img.src = "./assets/" + name + extensions[index];
        index++;

    }

    img.onerror = tryImage;
    tryImage();

});


// FLOATING FLOWERS

function createFlower() {

    const flower = document.createElement("div");

    flower.className = "flower";

    const flowers = ["🌸","🌷","💗","🌺","❤️"];

    flower.textContent =
        flowers[Math.floor(Math.random() * flowers.length)];

    flower.style.left = Math.random() * 100 + "vw";

    flower.style.fontSize =
        (18 + Math.random() * 20) + "px";

    document.body.appendChild(flower);

    setTimeout(() => flower.remove(),9000);

}

setInterval(createFlower,700);

</script>

</body>
</html>
